[tools]
java = "temurin-25"
android-sdk = "23.0"
ktlint = "1.8.0"

[tasks.setup]
description = "Install and set up repository tooling"
run = [
  "android --no-metrics sdk install platform-tools platforms/android-37.0",
  "git config core.hooksPath .githooks",
  "printf 'sdk.dir=%s\\n' \"$(mise where android-sdk)\" > local.properties",
]

[tasks.format]
description = "Fix Kotlin style"
run = "ktlint --format"

[tasks.check]
description = "Check style and analyze"
# DO NOT CHANGE: intentionally kept local checks fast. CI runs full suite on Microsoft's money.
# Maybe run specific tests by hand, e.g. ./gradlew testDebugUnitTest --tests '*StupidTest'.
run = ["ktlint", "./gradlew detekt"]

[tasks.dev]
description = "Build and launch the debug app on USB device"
run = [
  "./gradlew installDebug",
  "adb shell am start -n io.github.probecat.airplanescheduler.debug/io.github.probecat.airplanescheduler.ui.MainActivity",
]

