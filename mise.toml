[tools]
java = "temurin-21"
android-sdk = "23.0"
ktlint = "1.8.0"

[tasks.setup]
description = "Install SDK packages and set up Git hooks"
run = [
  "android --no-metrics sdk install platform-tools platforms/android-37.0",
  "git config core.hooksPath .githooks",
]

[tasks.ktlint]
description = "Check Kotlin style"
run = "ktlint"

[tasks.format]
description = "Fix Kotlin style"
run = "ktlint --format"

[tasks.check]
description = "Check style, test, and lint"
run = ["ktlint", "./gradlew testDebugUnitTest lintDebug"]

[tasks.dev]
description = "Build and launch the debug app on USB device"
run = [
  "./gradlew installDebug",
  "adb shell am start -n io.github.probecat.airplanescheduler.debug/io.github.probecat.airplanescheduler.ui.MainActivity",
]

