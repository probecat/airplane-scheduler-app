# Builds on the detekt defaults. Overrides only follow Compose conventions or idiomatic Kotlin.

naming:
  FunctionNaming:
    # Composables are PascalCase.
    ignoreAnnotated:
      - "Composable"

complexity:
  TooManyFunctions:
    # Counts functions, not complexity, so it fights the method size rules: splitting a long function adds more.
    active: false
  LongParameterList:
    # Composables take state and event lambdas as parameters instead of a ViewModel.
    ignoreAnnotated:
      - "Composable"
    # Parameters with defaults are optional, so callers do not have to pass them.
    ignoreDefaultParameters: true

style:
  ReturnCount:
    # Early returns read better than nesting.
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    # Minutes per hour and hours per day read more clearly as numbers.
    ignoreNumbers:
      - "-1"
      - "0"
      - "1"
      - "2"
      - "24"
      - "60"
    # Setting excludes replaces the defaults, so the test paths repeat here.
    # Layout and type values in Compose read more clearly inline.
    excludes:
      - "**/test/**"
      - "**/androidTest/**"
      - "**/ui/**"

Compose:
  CompositionLocalAllowlist:
    # Theme colors that MaterialTheme does not cover.
    allowedCompositionLocals:
      - "LocalWarningColors"
      - "LocalSuccessColors"
