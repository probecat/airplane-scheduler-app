plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.detekt)
}

android {
    namespace 'io.github.probecat.airplanescheduler'
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }

    defaultConfig {
        applicationId 'io.github.probecat.airplanescheduler'
        minSdk 28
        targetSdk 37
        versionCode 13
        versionName '4.0'
        manifestPlaceholders = [appLabel: 'Airplane Scheduler']
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appLabel: 'Airplane Scheduler (debug)']
        }
    }

    def releaseKeystore = System.getenv('RELEASE_KEYSTORE')
    if (releaseKeystore) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias 'release'
                keyPassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                storeType 'PKCS12'
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }

    androidResources {
        localeFilters += ['en']
    }

    packaging {
        dex {
            // APK is downloaded from F-Droid or GitHub. This halves the size of it.
            useLegacyPackaging = true
        }
        resources {
            excludes += ['kotlin/**.kotlin_builtins', 'META-INF/**/LICENSE.txt']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        aidl true
        buildConfig true
        compose true
    }

    testOptions {
        unitTests.includeAndroidResources = true
        // Robolectric needs JDK internals.
        unitTests.all { jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED' }
    }

    lint {
        warningsAsErrors true
        // Dependabot handles updates. These checks fail CI whenever a dependency releases.
        disable += ['AndroidGradlePluginVersion', 'GradleDependency', 'NewerVersionAvailable']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        allWarningsAsErrors = true
    }
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom(rootProject.file('config/detekt.yml'))
    parallel = true
}

dependencies {
    detektPlugins libs.compose.rules.detekt

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.ui
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.core.ktx
    implementation libs.kotlinx.serialization.json
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
}
