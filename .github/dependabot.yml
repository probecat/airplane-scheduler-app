version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    groups:
      gradle:
        patterns: ['*']
