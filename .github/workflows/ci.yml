name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - LICENSE
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Other runs each get their own commit's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the version and the F-Droid listing
        run: scripts/check-release.sh

  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: ktlint
      - name: Check Kotlin style
        run: ktlint --relative

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: zizmor@1.32.0
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec zizmor@1.32.0 -- zizmor --format=github .github/workflows

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          # Match with the pinned version in mise.toml
          distribution: temurin
          java-version: 21
          cache: gradle
      # The unsigned release build catches R8 and resource shrinking problems before a release.
      - name: Analyze, test, lint, and build
        run: ./gradlew detektDebug detektDebugUnitTest testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AirplaneScheduler-debug
          path: app/build/outputs/apk/debug/app-debug.apk
