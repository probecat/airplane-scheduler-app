name: F-Droid

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      signed-artifact:
        description: Artifact with a signed APK to check against F-Droid's build
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Follows the image F-Droid builds with. The job has no secrets, and its APK is only compared, never shipped.
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: inputs.signed-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.signed-artifact }}
          path: signed
      - name: Lint the recipe and build as F-Droid does
        if: ${{ !inputs.signed-artifact }}
        run: scripts/fdroid-build.sh . fdroid
      - name: Lint the recipe, build as F-Droid does, and check the signed APK against the build
        if: inputs.signed-artifact
        run: scripts/fdroid-build.sh . fdroid signed/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fdroid
          path: fdroid/
