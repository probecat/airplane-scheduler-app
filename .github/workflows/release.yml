name: Release

# Releases when main gets a new version. The tag is created with the release.
on:
  push:
    branches: [main]
    paths: [app/build.gradle]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      previous: ${{ steps.check.outputs.previous }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the version and the F-Droid listing
        id: check
        run: scripts/check-release.sh >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Lint and build signed APK
        env:
          RELEASE_KEYSTORE: "${{ runner.temp }}/release.p12"
          RELEASE_KEYSTORE_BASE64: "${{ secrets.RELEASE_KEYSTORE_BASE64 }}"
          RELEASE_KEYSTORE_PASSWORD: "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE"
          ./gradlew lintRelease assembleRelease
      - name: Verify signed APK
        run: |
          apksigner=$(printf "%s\n" "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: app/build/outputs/apk/release/app-release.apk

  fdroid:
    needs: build
    uses: $/.github/workflows/fdroid.yml
    with:
      signed-artifact: signed

  release:
    needs: [check, build, fdroid]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ needs.check.outputs.tag }}"
          NOTES: "${{ needs.check.outputs.notes }}"
          PREVIOUS: "${{ needs.check.outputs.previous }}"
        run: |
          # Fixed name for the README's releases/latest/download link.
          mv app-release.apk airplane-scheduler.apk
          {
            cat "$NOTES"
            [[ -z $PREVIOUS ]] || printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS" "$TAG"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" airplane-scheduler.apk --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/notes.md" --title "Airplane Scheduler $TAG"
